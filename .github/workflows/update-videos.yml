name: Actualizar videos del canal

on:
  schedule:
    - cron: '45 0 * * *'   # diario 00:45 UTC = 6:45 PM CDMX (los videos suben ~6:15 PM)
  workflow_dispatch:        # permite correrlo manual desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Actualizar sección de videos desde el RSS del canal
        run: python scripts/update_videos.py

      - name: Regenerar reseñas, sitemap y llms.txt (fuente única, anti-drift)
        run: python build_resenas.py

      - name: Regenerar páginas de listas (fuente única, anti-drift)
        run: python build_listas.py

      - name: Commit y push si hubo cambios
        run: |
          git add index.html llms.txt sitemap.xml robots.txt resenas listas assets/resenas.json
          if git diff --cached --quiet; then
            echo "Sin cambios: nada que publicar."
          else
            git config user.name "dosparaduo-bot"
            git config user.email "actions@github.com"
            git commit -m "Auto: videos + reseñas/sitemap/llms regenerados desde la fuente"
            git push
          fi
